name: ci

on:
  push:
    branches: [main]
    paths:
      - 'skills/**'
      - 'scripts/**'
      - 'docs/**'
      - 'AGENTS.md'
      - 'CLAUDE.md'
      - 'PLAN.md'
      - 'README.md'
      - 'SKILLS_CATEGORIES.md'
      - 'SKILLS_INSTALLATION_GUIDE.md'
  pull_request:
    paths:
      - 'skills/**'
      - 'scripts/**'
      - 'docs/**'
      - 'AGENTS.md'
      - 'CLAUDE.md'
      - 'PLAN.md'
      - 'README.md'
      - 'SKILLS_CATEGORIES.md'
      - 'SKILLS_INSTALLATION_GUIDE.md'

jobs:
  validate:
    name: Validate skills
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/validate-skills.mjs
