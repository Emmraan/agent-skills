name: skills-sweep

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

jobs:
  sweep:
    name: Validate all skills
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: package.json
      - run: node scripts/validate-skills.mjs --all
