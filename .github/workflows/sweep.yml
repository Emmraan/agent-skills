name: skills-sweep

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

jobs:
  sweep:
    name: Validate all skills
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - run: node scripts/validate-skills.mjs --all
